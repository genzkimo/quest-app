<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Quest</title>

    <!-- من الملف الأول الذي يعمل -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!--
      Theme color ديناميكي.
      الملف القديم كان يحتوي على أكثر من meta theme-color حسب prefers-color-scheme،
      والملف الجديد يعدّلها عبر JavaScript.
      هنا نستخدم واحد فقط حتى لا يحدث تعارض.
    -->
    <meta name="theme-color" content="#0B132B" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!--
      من الملف الثاني:
      تطبيق الوضع الداكن/الفاتح قبل ظهور الصفحة لتجنب الوميض.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("quest_app_dark_mode");

          var isDark =
            stored !== null
              ? stored === "true"
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;

          var root = document.documentElement;

          if (isDark) {
            root.classList.add("dark");
          } else {
            root.classList.remove("dark");
          }

          // يساعد المتصفح/النظام على فهم الوضع الحالي للعناصر الأصلية
          root.style.colorScheme = isDark ? "dark" : "light";

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", isDark ? "#0B132B" : "#F8FAFC");
          }
        } catch (e) {}
      })();
    </script>

    <!--
      من الملف الثاني:
      تنسيقات Splash Screen الأولية التي تظهر قبل تحميل React/Vite.
    -->
    <style>
      #root:empty {
        display: block;
      }

      .initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        user-select: none;
        z-index: 99999;
        overflow: hidden;
      }

      html.dark .initial-splash {
        background-color: #0b132b;
      }

      html:not(.dark) .initial-splash {
        background-color: #f8fafc;
      }

      html.dark .splash-glow {
        background-color: rgba(252, 13, 130, 0.05);
      }

      html:not(.dark) .splash-glow {
        background-color: rgba(252, 13, 130, 0.08);
      }

      html.dark .splash-quest-text {
        color: #ffffff;
        filter: drop-shadow(0 4px 24px rgba(252, 13, 130, 0.35));
      }

      html:not(.dark) .splash-quest-text {
        color: #0f172a;
        filter: drop-shadow(0 4px 24px rgba(252, 13, 130, 0.25));
      }

      html.dark .splash-from-text {
        color: rgba(255, 255, 255, 0.5);
      }

      html:not(.dark) .splash-from-text {
        color: #94a3b8;
      }

      html.dark .splash-monogram {
        stroke: #ffffff;
      }

      html:not(.dark) .splash-monogram {
        stroke: #0f172a;
      }

      html.dark .splash-brand-title {
        color: #ffffff;
      }

      html:not(.dark) .splash-brand-title {
        color: #0f172a;
      }

      html.dark .splash-brand-sub {
        color: rgba(255, 255, 255, 0.7);
      }

      html:not(.dark) .splash-brand-sub {
        color: #64748b;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!--
        من الملف الثاني:
        Splash screen أولية تظهر قبل أن يحمّل React التطبيق.
        عند تشغيل React عادةً سيتم استبدال محتوى #root، وبالتالي يختفي هذا الـ loader تلقائيًا.
      -->
      <div id="initial-loader" class="initial-splash">
        <div
          class="splash-glow"
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 384px;
            height: 384px;
            border-radius: 9999px;
            filter: blur(120px);
            pointer-events: none;
          "
        ></div>

        <div
          style="
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
          "
        >
          <svg
            viewBox="0 0 140 140"
            style="width: 96px; height: 96px; aspect-ratio: 1/1"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g transform="translate(18, 4) skewX(-12)">
              <rect x="5" y="5" width="122" height="122" rx="36" fill="#FC0D82" />
              <circle cx="72" cy="38" r="10.5" fill="white" />
              <rect x="42" y="48" width="13" height="28" rx="6.5" fill="white" />
              <path
                d="M 58,50 C 62,64 68,76 72,78"
                stroke="white"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M 55,54 C 44,57 41,68 40,71"
                stroke="white"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M 68,54 L 86,60"
                stroke="white"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M 70,76 L 84,90 L 76,98"
                stroke="white"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M 58,74 C 44,81 50,91 48,93"
                stroke="white"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <rect x="94" y="42" width="20" height="29" rx="4.5" fill="white" />
              <path
                d="M 100,53 C 101,55 103.5,56.5 104,56.5 C 104.5,56.5 107,55 108,53 C 109,51 107.5,49.5 106.5,50.5 L 104,53 L 101.5,50.5 C 100.5,49.5 99,51 100,53 Z"
                fill="#FC0D82"
              />
            </g>
          </svg>

          <div
            style="
              margin-top: 20px;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <span
              class="splash-quest-text"
              style="
                font-family: sans-serif;
                font-weight: 900;
                font-style: italic;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                font-size: 36px;
              "
              >Quest</span
            >
          </div>
        </div>

        <div
          dir="ltr"
          style="
            position: absolute;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            z-index: 20;
          "
        >
          <span
            class="splash-from-text"
            style="
              font-size: 10px;
              text-transform: uppercase;
              font-weight: 600;
              letter-spacing: 0.25em;
            "
            >from</span
          >

          <div
            style="
              display: flex;
              align-items: center;
              gap: 10px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
              "
            >
              <svg
                style="width: 20px; height: 20px"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M 12 12 H 20.5 V 20.5 H 3.5 V 3.5 H 20.5 L 3.5 20.5"
                  class="splash-monogram"
                  stroke-width="2.3"
                  stroke-linecap="round"
                  stroke-linejoin="miter"
                  stroke-miterlimit="6"
                />
              </svg>
            </div>

            <div
              style="
                display: flex;
                align-items: baseline;
                gap: 6px;
                font-family: sans-serif;
              "
            >
              <span
                class="splash-brand-title"
                style="
                  font-size: 13px;
                  font-weight: 900;
                  letter-spacing: -0.01em;
                "
                >Gen Z</span
              >
              <span
                class="splash-brand-sub"
                style="
                  font-size: 11px;
                  font-weight: 500;
                  letter-spacing: 0.02em;
                "
                >inc</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- من الملف الأول الذي يعمل -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
